version: '3.8'

services:
  text-to-sql-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-to-sql-llm
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - text-to-sql-network

  nginx:
    image: nginx:latest
    container_name: text-to-sql-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - text-to-sql-app
    networks:
      - text-to-sql-network
    restart: unless-stopped

networks:
  text-to-sql-network:
    driver: bridge
