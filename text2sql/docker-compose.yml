services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-to-sql-llm
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - USER_STORE_PATH=/app/.data/users.json
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      # Named volume so registered accounts survive a rebuild.
      - user-store:/app/.data
    restart: unless-stopped
    networks:
      - text-to-sql

  # TLS terminating reverse proxy. Start it with:
  #   docker compose --profile proxy up
  # It needs ./nginx.conf and certificates in ./certs.
  nginx:
    image: nginx:stable
    container_name: text-to-sql-nginx
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - text-to-sql
    restart: unless-stopped

networks:
  text-to-sql:
    driver: bridge

volumes:
  user-store:
