[tool:pytest]
# The test suite lives at the repository root (../tests) and is run from
# there, so it can exercise both this subproject and the analyst package.
testpaths = ../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short

[coverage:run]
source = src, config, utils
omit =
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
