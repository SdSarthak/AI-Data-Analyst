# Streamlit configuration.
# This file must be valid TOML. A Python docstring used to sit at the top,
# which made Streamlit fail to parse it.

[theme]
primaryColor = "#3498db"
backgroundColor = "#2c3e50"
secondaryBackgroundColor = "#34495e"
textColor = "#ecf0f1"
font = "sans serif"

[client]
showErrorDetails = true

[logger]
level = "info"

[server]
port = 8501
headless = false
runOnSave = true
maxUploadSize = 10
enableXsrfProtection = true
