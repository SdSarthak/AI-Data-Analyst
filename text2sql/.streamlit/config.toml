"""
Streamlit configuration file
"""

[theme]
primaryColor = "#3498db"
backgroundColor = "#2c3e50"
secondaryBackgroundColor = "#34495e"
textColor = "#ecf0f1"
font = "sans serif"

[client]
showErrorDetails = true
showSidebarNavigation = true

[logger]
level = "info"

[server]
port = 8501
headless = false
runOnSave = true
maxUploadSize = 10
enableCORS = true
enableXsrfProtection = true
